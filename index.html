<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASCIIER.</title>
    <link rel="icon" href="Favicon.png" type="image/x-icon"/>
    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background: black;
            color: white;
            margin: 0;
            font-family: 'Times New Roman', Times, serif;
        }

        /* TOP SECTION */

        .header {
            text-align: center;
            padding-top: 40px;
        }

        .title {
            color: yellow;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .title h1 {
            margin: 0;
        }


        /* UPLOAD BUTTON */

        .upload {
            display: inline-block;

            background: yellow;
            color: black;

            padding: 10px 18px;

            border-radius: 6px;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.15s;
        }

        .upload:hover {
            background: white;
        }

        .upload input {
            display: none;
        }


        /* SLIDER */

        .slider-container {
            width: 300px;
            max-width: 80%;

            margin: 20px auto 30px;

            text-align: center;
        }

        .slider-label {
            font-size: 12px;
            color: #777;

            margin-bottom: 8px;
        }

        #width {
            width: 100%;

            accent-color: yellow;

            cursor: pointer;
        }


        /* ASCII OUTPUT */

        .ascii-container {
            width: 90vw;
            height: 70vh;

            margin: 0 auto;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        #ascii {
            margin: 0;

            font-family: monospace;
            color: rgb(255, 255, 200);

            font-size: 8px;
            line-height: 8px;
            letter-spacing: -1px;

            white-space: pre;

            transform-origin: center;
        }

        

    </style>

</head>


<body>


    <!-- HEADER -->

    <div class="header">

        <div class="title">
            <h1>ASCIIER.</h1>
        </div>


        <!-- UPLOAD -->

        <label class="upload">

            Upload

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

        </label>


        <!-- SLIDER -->

        <div class="slider-container">

            <div class="slider-label">
                Resolution:
            </div>

            <input
                type="range"
                id="width"
                min="50"
                max="800"
                value="150"
            >

        </div>

    </div>


    <!-- ASCII -->

    <div class="ascii-container">

        <pre id="ascii"></pre>

    </div>


    <!-- HIDDEN CANVAS -->

    <canvas id="canvas" hidden></canvas>

    <div class="ascii-animation">
        @%#*+=-:. @%#*+=-:. @%#*+=-:. @%#*+=-:.
    </div>

    <script>

        const imageInput =
            document.getElementById("imageInput");

        const widthSlider =
            document.getElementById("width");

        const ascii =
            document.getElementById("ascii");

        const canvas =
            document.getElementById("canvas");


        let image = null;


        // Upload image

        imageInput.addEventListener("change", () => {

            const file = imageInput.files[0];

            if (!file) return;


            const reader = new FileReader();


            reader.onload = (event) => {

                image = new Image();


                image.onload = () => {

                    generateASCII();

                };


                image.src = event.target.result;

            };


            reader.readAsDataURL(file);

        });


        // Slider

        widthSlider.addEventListener("input", () => {

            if (image) {

                generateASCII();

            }

        });


        // Generate ASCII

        function generateASCII() {

            const width =
                Number(widthSlider.value);


            // Keep original image ratio

            const height =
                Math.floor(
                    (image.height / image.width) *
                    width *
                    0.5
                );


            canvas.width = width;
            canvas.height = height;


            const ctx =
                canvas.getContext("2d");


            // Draw resized image

            ctx.drawImage(
                image,
                0,
                0,
                width,
                height
            );


            // Get pixels

            const pixels =
                ctx.getImageData(
                    0,
                    0,
                    width,
                    height
                ).data;


            // ASCII characters

            const characters =
                "@%#*+=-:. ";


            let result = "";


            // Convert pixels

            for (let y = 0; y < height; y++) {

                for (let x = 0; x < width; x++) {

                    const pixel =
                        (y * width + x) * 4;


                    const r =
                        pixels[pixel];

                    const g =
                        pixels[pixel + 1];

                    const b =
                        pixels[pixel + 2];


                    // Brightness

                    const brightness =
                        0.299 * r +
                        0.587 * g +
                        0.114 * b;


                    // Character

                    const index =
                        Math.floor(
                            (brightness / 255) *
                            (characters.length - 1)
                        );


                    result +=
                        characters[index];

                }


                result += "\n";

            }


            ascii.textContent = result;

            const container = document.querySelector(".ascii-container");

            const scaleX = container.clientWidth / ascii.scrollWidth;
            const scaleY = container.clientHeight / ascii.scrollHeight;

            const scale = Math.min(scaleX, scaleY, 1);

            ascii.style.transform = `scale(${scale})`;
        }

    </script>

</body>

</html
