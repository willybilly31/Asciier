<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASCIIER.</title>
    <link rel="icon" href="Favicon.png" type="image/x-icon"/>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background: black;
            color: white;
            margin: 0;
            font-family: 'Times New Roman', Times, serif;
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding-top: 40px;
            position: relative;
            z-index: 1;
        }

        .title {
            color: yellow;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .title h1 {
            margin: 0;
        }

        .upload {
            display: inline-block;
            padding: 10px 18px;

            background: yellow;
            color: black;
            border: 1px solid yellow;
            border-radius: 6px;

            font-family: inherit;
            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.15s;
        }

        .upload:hover {
            background: black;
            color:white;
        }

        .upload input {
            display: none;
        }

        .slider-container {
            width: 300px;
            max-width: 80%;
            margin: 20px auto 30px;
            text-align: center;
        }

        .slider-label {
            font-size: 12px;
            color: #777;
            margin-bottom: 8px;
        }

        #width {
            width: 100%;
            accent-color: yellow;
            cursor: pointer;
        }

        .ascii-container {
            position: relative;
            z-index: 1;

            width: 90vw;
            height: 70vh;

            margin: 0 auto;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        #ascii {
            margin: 0;

            font-family: monospace;
            color: rgb(255, 255, 200);

            font-size: 8px;
            line-height: 8px;
            letter-spacing: -1px;

            white-space: pre;

            transform-origin: center;
        }

        .ascii-background {
            position: fixed;

            top: -100vh;
            left: -100vw;

            width: 300vw;
            height: 300vh;

            overflow: hidden;

            transform: rotate(-45deg);

            pointer-events: none;

            z-index: 0;
        }

        .ascii-background-text {
            position: absolute;

            width: 100%;
            height: 100%;

            font-family: monospace;
            font-size: 14px;
            line-height: 1.2;
            letter-spacing: 2px;

            color: yellow;
            opacity: 0.08;

            white-space: pre;

            animation: asciiMove 35s linear infinite;
        }

        @keyframes asciiMove {
            from {
                transform: translateX(-200px);
            }

            to {
                transform: translateX(200px);
            }
        }

        #invertButton,
        #exportButton {
            margin-left: 8px;
            padding: 10px 18px;

            background: yellow;
            color: black;
            border: 1px solid yellow;
            border-radius: 6px;

            font-family: inherit;
            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.15s;
        }

        #invertButton:hover,
        #exportButton:hover {
            background: black;
            color: white;
        }

        #customChars{
            background: black;
            color: yellow;
            border: 1px solid yellow;
            border-radius: 3px;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 14px;
            width: 200px;
            text-align: center;
            outline: none;
            
        }


    </style>

</head>

<body>

    <div class="header">

        <div class="title">
            <h1>ASCIIER.</h1>
        </div>
        <p style="Color:yellow;">Made by Liam</p>

        <label class="upload">
            Upload
            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >
        </label>

        <button id="invertButton">
            Invert
        </button>

        <button id="exportButton">
            Export PNG
        </button>

        <div class="input-container" style="margin-top: 20px;">
            <div class="slider-label">
                Custom Characters (Dark to Light):
            </div>
            <input type="text" id="customChars" value="@%#*+=-:. ">
        </div>

        <div class="slider-container">

            <div class="slider-label">
                Resolution:
            </div>

            <input
                type="range"
                id="width"
                min="100"
                max="1000"
                value="150"
            >

        </div>

    </div>

    <div class="ascii-container">
        <pre id="ascii"></pre>
    </div>

    <canvas id="canvas" hidden></canvas>

    <div class="ascii-background">
        <div
            class="ascii-background-text"
            id="asciiBackground"
        ></div>
    </div>


    <script>
        const imageInput = document.getElementById("imageInput");
        const widthSlider = document.getElementById("width");
        const ascii = document.getElementById("ascii");
        const canvas = document.getElementById("canvas");
        const background = document.getElementById("asciiBackground");
        const invertButton = document.getElementById("invertButton");
        const exportButton = document.getElementById("exportButton");
        const customCharsInput = document.getElementById("customChars");

        let image = null;
        let inverted = true;

        // Image Upload
        imageInput.addEventListener("change", (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                image = new Image();
                image.onload = generateASCII;
                image.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Controls
        widthSlider.addEventListener("input", () => {
            if (image) generateASCII();
        });

        invertButton.addEventListener("click", () => {
            inverted = !inverted;
            if (image) generateASCII();
        });

        // Update live when user types new characters
        customCharsInput.addEventListener("input", () => {
            if (image) generateASCII();
        });

        // Ascii Art Generation
        function generateASCII() {
            const width = Number(widthSlider.value);
            const height = Math.floor((image.height / image.width) * width * 0.5);

            // Setup canvas
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(image, 0, 0, width, height);

            // Process pixels
            const pixels = ctx.getImageData(0, 0, width, height).data;
            let result = "";

            // Grab characters from the input field, default to a space if they delete everything to prevent crashes
            const characters = customCharsInput.value || " ";

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const pixelIndex = (y * width + x) * 4;
                    const r = pixels[pixelIndex];
                    const g = pixels[pixelIndex + 1];
                    const b = pixels[pixelIndex + 2];

                    // Calculate brightness
                    let brightness = 0.299 * r + 0.587 * g + 0.114 * b;
                    if (inverted) brightness = 255 - brightness;

                    // Map brightness to a character
                    const charIndex = Math.floor((brightness / 255) * (characters.length - 1));
                    result += characters[charIndex];
                }
                result += "\n";
            }

            ascii.textContent = result;

            // Scale ASCII to fit container
            const container = document.querySelector(".ascii-container");
            const scale = Math.min(
                container.clientWidth / ascii.scrollWidth,
                container.clientHeight / ascii.scrollHeight,
                1
            );
            ascii.style.transform = `scale(${scale})`;
        }

        // Random gen for the background
        function setupBackground() {
            let text = "";
            
            // Grab characters from the input field (check if element exists just in case it runs early)
            const characters = customCharsInput ? (customCharsInput.value || "LIAM") : "LIAM";

            for (let row = 0; row < 300; row++) {
                for (let col = 0; col < 500; col++) {
                    const randomChar = characters[Math.floor(Math.random() * characters.length)];
                    text += randomChar;
                }
                text += "\n";
            }
            background.textContent = text;
        }
        setupBackground(); // Run once on load

        // Export to png
        exportButton.addEventListener("click", () => {
            if (!ascii.textContent.trim()) return;

            const lines = ascii.textContent.split("\n");
            const fontSize = 8;
            const lineHeight = 8;
            const padding = 20;

            const exportCanvas = document.createElement("canvas");
            const ctx = exportCanvas.getContext("2d");
            ctx.font = `${fontSize}px monospace`;

            // Calculate canvas size based on text
            const textWidth = Math.max(...lines.map(line => ctx.measureText(line).width));
            exportCanvas.width = textWidth + padding * 2;
            exportCanvas.height = (lines.length * lineHeight) + padding * 2;

            // Draw black background
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

            // Draw ASCII text
            ctx.fillStyle = "rgb(255, 255, 200)";
            ctx.font = `${fontSize}px monospace`;
            ctx.textBaseline = "top";

            lines.forEach((line, i) => {
                ctx.fillText(line, padding, padding + (i * lineHeight));
            });

            // Trigger download
            const link = document.createElement("a");
            link.download = "asciier.png";
            link.href = exportCanvas.toDataURL("image/png");
            link.click();
        });
    </script>

</body>

</html>
