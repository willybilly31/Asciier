<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ASCIIER.</title>
    <link rel="icon" href="Favicon.png" type="image/x-icon"/>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background: black;
            color: white;
            margin: 0;
            font-family: 'Times New Roman', Times, serif;
            overflow: hidden;
        }

        .header {
            text-align: center;
            padding-top: 40px;
            position: relative;
            z-index: 1;
        }

        .title {
            color: yellow;
            font-size: 20px;
            margin-bottom: 20px;
        }

        .title h1 {
            margin: 0;
        }

        .upload {
            display: inline-block;
            background: yellow;
            color: black;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
        }

        .upload:hover {
            background: white;
        }

        .upload input {
            display: none;
        }

        .slider-container {
            width: 300px;
            max-width: 80%;
            margin: 20px auto 30px;
            text-align: center;
        }

        .slider-label {
            font-size: 12px;
            color: #777;
            margin-bottom: 8px;
        }

        #width {
            width: 100%;
            accent-color: yellow;
            cursor: pointer;
        }

        .ascii-container {
            position: relative;
            z-index: 1;

            width: 90vw;
            height: 70vh;

            margin: 0 auto;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        #ascii {
            margin: 0;

            font-family: monospace;
            color: rgb(255, 255, 200);

            font-size: 8px;
            line-height: 8px;
            letter-spacing: -1px;

            white-space: pre;

            transform-origin: center;
        }

        .ascii-background {
            position: fixed;

            top: -100vh;
            left: -100vw;

            width: 300vw;
            height: 300vh;

            overflow: hidden;

            transform: rotate(-45deg);

            pointer-events: none;

            z-index: 0;
        }

        .ascii-background-text {
            position: absolute;

            width: 100%;
            height: 100%;

            font-family: monospace;
            font-size: 14px;
            line-height: 1.2;
            letter-spacing: 2px;

            color: yellow;
            opacity: 0.08;

            white-space: pre;

            animation: asciiMove 8s linear infinite;
        }

        @keyframes asciiMove {
            from {
                transform: translateX(-200px);
            }

            to {
                transform: translateX(200px);
            }
        }

        #invertButton {
            margin-left:8px;
            padding:10px 18px;

            background:yellow;
            color: black;
            border: 1px solid yellow;
            border-radius: 6px;

            font-family:inherit;
            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.15s;
        }

        #invertButton:hover{
            background:white;
            color: black;
        }

    </style>

</head>

<body>

    <div class="header">

        <div class="title">
            <h1>ASCIIER.</h1>
        </div>

        <label class="upload">
            Upload
            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >
        </label>

            <button id="invertButton">Invert</button>


        <div class="slider-container">

            <div class="slider-label">
                Resolution:
            </div>

            <input
                type="range"
                id="width"
                min="50"
                max="800"
                value="150"
            >

        </div>

    </div>

    <div class="ascii-container">
        <pre id="ascii"></pre>
    </div>

    <canvas id="canvas" hidden></canvas>

    <div class="ascii-background">
        <div
            class="ascii-background-text"
            id="asciiBackground"
        ></div>
    </div>

    <script>

        const imageInput =
            document.getElementById("imageInput");

        const widthSlider =
            document.getElementById("width");

        const ascii =
            document.getElementById("ascii");

        const canvas =
            document.getElementById("canvas");

        const background =
            document.getElementById("asciiBackground");

        let image = null;

        imageInput.addEventListener("change", () => {

            const file = imageInput.files[0];

            if (!file) return;

            const reader = new FileReader();

            reader.onload = (event) => {

                image = new Image();

                image.onload = () => {
                    generateASCII();
                };

                image.src = event.target.result;

            };

            reader.readAsDataURL(file);

        });

        widthSlider.addEventListener("input", () => {

            if (image) {
                generateASCII();
            }

        });

        function generateASCII() {

            const width =
                Number(widthSlider.value);

            const height =
                Math.floor(
                    (image.height / image.width) *
                    width *
                    0.5
                );

            canvas.width = width;
            canvas.height = height;

            const ctx =
                canvas.getContext("2d");

            ctx.drawImage(
                image,
                0,
                0,
                width,
                height
            );

            const pixels =
                ctx.getImageData(
                    0,
                    0,
                    width,
                    height
                ).data;

            const characters =
                "@%#*+=-:. ";

            let result = "";

            for (let y = 0; y < height; y++) {

                for (let x = 0; x < width; x++) {

                    const pixel =
                        (y * width + x) * 4;

                    const r =
                        pixels[pixel];

                    const g =
                        pixels[pixel + 1];

                    const b =
                        pixels[pixel + 2];

                    let brightness =
                        0.299 * r +
                        0.587 * g +
                        0.114 * b;

                    if (inverted) {
                        brightness = 255 - brightness;
                    }

                    const index =
                        Math.floor(
                            (brightness / 255) *
                            (characters.length - 1)
                        );

                    result +=
                        characters[index];

                }

                result += "\n";

            }

            ascii.textContent = result;

            const container =
                document.querySelector(".ascii-container");

            const scaleX =
                container.clientWidth /
                ascii.scrollWidth;

            const scaleY =
                container.clientHeight /
                ascii.scrollHeight;

            const scale =
                Math.min(
                    scaleX,
                    scaleY,
                    1
                );

            ascii.style.transform =
                `scale(${scale})`;

        }

        const chars =
            "@%#*+=-:. ";

        const rows = 300;
        const columns = 500;

        let text = "";

        for (let row = 0; row < rows; row++) {

            for (let column = 0; column < columns; column++) {

                text += chars[
                    Math.floor(
                        Math.random() *
                        chars.length
                    )
                ];

            }

            text += "\n";

        }

        background.textContent = text;

        const invertButton =
        document.getElementById("invertButton");

    let inverted = true;

    invertButton.addEventListener("click", () => {
        inverted = !inverted;

        if (image) {
            generateASCII();
        }
    });

    
    </script>

</body>

</html>
